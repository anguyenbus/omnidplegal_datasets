[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/get_omni_dp_bench"]

[project]
name = "get-omni-english"
version = "0.1.0"
description = "CLI tool to download and prepare English-only document parsing benchmark datasets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.20.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "beartype>=0.18.0",
    "requests>=2.31.0",
]

[project.scripts]
get-data = "get_omni_dp_bench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D203", "D212"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
